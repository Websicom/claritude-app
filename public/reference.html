function incidents(account=false){let data=account?[['North Commerce','30 Sep, 10:42','HTTP 503','Ongoing'],['Websi','24 Sep, 09:10','HTTP 500 · 20 min','Resolved'],['Websi','12 Sep, 14:25','Timeout · 15 min','Resolved']]:[['24 September at 09:10','HTTP 500','20 minutes','Resolved'],['12 September at 14:25','Timeout','15 minutes','Resolved']];return `<div class="panel"><div class="panel-head"><h2>${account?'Account incidents':'Incident history'}</h2><span class="spacer"></span><button class="btn" onclick="filterMenu(event,true)">${ico('filter')} Filters</button></div><p class="subtle">Filter by open/resolved, failure type, date range or duration.</p>${data.map((x,i)=>`<details class="incident-item"><summary><b>${x[0]}</b> · ${x[1]} <span class="tag">${x[3]||x[2]}</span></summary><div class="incident-timeline"><span><i></i><b>Failure detected</b><small>${i?'14:25':'09:10'} · ${x[2]}</small></span><span><i></i><b>Confirmation check failed</b><small>Monitor retried after 5 minutes</small></span><span><i></i><b>Incident confirmed</b><small>Alert sent to configured recipients</small></span><span class="recovered"><i></i><b>${x[3]==='Ongoing'?'Awaiting recovery':'Recovery confirmed'}</b><small>${x[3]==='Ongoing'?'Latest retry still failing':`${x[2]} total duration`}</small></span></div></details>`).join('')}</div>`}
function maintenance(){let m=store.get('maintenance',[]);return `<div class="panel"><div class="panel-head"><h2>Maintenance windows</h2><span class="spacer"></span><button class="btn" onclick="dialog('maintenance')">Add window</button></div>${m.length?simpleTable(['Name','When','Timezone','Alerts'],m):'<p class="subtle">No scheduled windows. Add one to suppress demo alerts during planned work.</p>'}</div>`}
function alerts(){return `<div class="grid equal"><div class="panel"><h2>Recipients</h2>${simpleTable(['Email','Down','Recovery'],[['sales@websi.com','On','On'],['colleague@example.com','On','On']])}<div class="settings-actions"><button class="btn" onclick="dialog('invite')">Add recipient</button></div></div><div class="panel"><h2>Alert policy</h2>${fields([['Confirmation threshold','2 failed checks'],['Reminder policy','Every 30 minutes'],['Recovery alerts','Enabled']])}<div class="settings-actions"><button class="btn" onclick="state.notifications++;toast('Test alert added to demo inbox');render()">Send test alert</button></div></div></div>`}
function monitor(){let free=state.freePreview||state.workspace==='Internal projects',options=['5 minutes','10 minutes','15 minutes','30 minutes','1 hour','24 hours'].map((x,i)=>`<option ${free&&i<2?'disabled':''}>${x}${free&&i<2?' · paid plan':''}</option>`).join('');return `<div class="panel" data-settings-form><h2>Monitor settings</h2>${free?'<div class="upgrade-note"><b>Monitor every five minutes with a paid plan.</b><span>Free includes checks every 15 minutes or slower.</span></div>':''}<label class="field">Check interval<select id="monitorInterval" onchange="markDirty()">${options}</select></label>${fields([['Timeout','15 seconds'],['Confirm after','2 failed checks'],['Execution','Distributed infrastructure'],['Method','GET'],['Expected response','HTTP 200']])}<div class="settings-actions"><button class="primary" onclick="saved('Monitor settings')">Save monitor settings</button><button class="btn danger" onclick="state.monitorPaused=!state.monitorPaused;applied(state.monitorPaused?'Monitoring pause':'Monitoring resume');render()">${state.monitorPaused?'Resume monitoring':'Pause monitoring'}</button></div></div>`}
function audit(){let ts=['Overview','Findings','Checks','History','Compare'],d=auditDataset(),b=state.tab==='Findings'?findings():state.tab==='Checks'?checks():state.tab==='History'?historyView():state.tab==='Compare'?compare():auditHome();return title('Audit',`<button class="primary" onclick="showAuditDialog()">${ico('rotateCw')} Run audit</button>`)+`<div class="audit-nav-row"><button class="audit-page-picker" onclick="auditPageMenu(event)">${ico('globe')}<span>${esc(d.label)} <small>(${esc(auditPagePath())})</small></span>${ico('chevronDown')}</button><button class="iconbtn audit-add-page" aria-label="Add page" title="Add page" onclick="showAddAuditPage()">${ico('plus')}</button>${tabs(ts)}</div>`+(state.tab==='Overview'?auditStats(d):'')+b}
function showAuditDialog(){closePop();let d=auditDataset(),path=auditPagePath(),o=document.createElement('div');o.className='overlay';o.setAttribute('role','presentation');o.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Run ${esc(d.label)} audit</h2><div class="kv"><span>Page</span><b>${ico('globe')} https://websi.com${esc(path)}</b></div><p class="subtle">Mobile and desktop checks will run together for this page.</p><div class="dialog-actions"><button class="btn" onclick="closeDialog()">Cancel</button><button class="primary" onclick="runAuditNow()">Run audit</button></div></div>`;document.body.appendChild(o);o.addEventListener('mousedown',e=>{if(e.target===o)closeDialog()});document.addEventListener('keydown',escDialog)}
function runAuditNow(){closeDialog();toast('Audit queued…');setTimeout(()=>toast('Running mobile and desktop checks…'),450);setTimeout(()=>toast('Audit complete — results saved'),1050)}
function auditPagePath(){return state.auditPages.find(x=>x[0]===state.auditPage)?.[2]||'/'}
function auditDataset(){let all={homepage:{label:'Homepage',overall:87,seo:94,performance:82,accessibility:91,security:88,infrastructure:92,ai:84,lcp:'3.4s',fcp:'1.9s'},services:{label:'Services',overall:91,seo:96,performance:88,accessibility:94,security:92,infrastructure:95,ai:89,lcp:'2.8s',fcp:'1.6s'},contact:{label:'Contact',overall:84,seo:90,performance:76,accessibility:86,security:84,infrastructure:88,ai:80,lcp:'3.9s',fcp:'2.2s'}};let found=all[state.auditPage];if(found)return found;let page=state.auditPages.find(x=>x[0]===state.auditPage);return {...all.homepage,label:page?.[1]||'Homepage'}}
function auditStats(d){let scoreClass=d.overall>=80?'good':d.overall>=60?'warn':'bad',tip=`${d.overall}/100 — This is the ${d.label} page score based on the latest metrics. To improve the result, fix the issues listed below.`,scores=[['SEO',d.seo],['Performance',d.performance],['Accessibility',d.accessibility],['Security',d.security],['Infrastructure',d.infrastructure],['AI Readiness',d.ai]];return `<div class="audit-score-row"><div class="audit-score ${scoreClass}" style="--score:${d.overall}" tabindex="0" data-tooltip="${tip}" aria-label="${tip}"><span>${d.overall}</span></div><div class="audit-six-stats">${scores.map((x,i)=>`<div class="audit-six-stat"><small>${x[0]}</small><b>${x[1]}</b><span class="trend-up">↗ +${[4,8,5,3,6,7][i]}</span></div>`).join('')}</div></div>`}
function auditPageMenu(e){e.stopPropagation();closePop();let m=document.createElement('div');m.className='menu audit-page-menu';m.id='popover';m.innerHTML=`<b style="display:block;padding:8px">Select a page</b>${state.auditPages.map(p=>`<button onclick="selectAuditPage('${p[0]}')">${ico('globe')}<span><b>${esc(p[1])}</b><small>${esc(p[2])}</small></span>${state.freePreview&&p[0]!=='homepage'?ico('lock'):state.auditPage===p[0]?'<span class="spacer"></span>✓':''}</button>`).join('')}<div class="menu-divider"></div><button class="menu-add" onclick="closePop();showAddAuditPage()">${ico('plus')} Add page</button>`;document.body.appendChild(m);let r=e.currentTarget.getBoundingClientRect();m.style.left=r.left+'px';m.style.top=Math.min(innerHeight-m.offsetHeight-8,r.bottom+5)+'px';setTimeout(()=>addEventListener('click',outside,{once:true}))}
function selectAuditPage(id){if(state.freePreview&&id!=='homepage'){closePop();return detailDialog('Audit additional pages with Essentials',`<p>Free includes a homepage audit. Upgrade to Essentials to audit service, contact and other important pages.</p><p class="subtle">Essentials also unlocks five-minute monitoring and greater analytics retention.</p>`,`<button class="primary" onclick="go('/account/billing%20%26%20plan');closeDialog()">Review Essentials</button>`)}state.auditPage=id;state.auditFilter=null;state.auditSeverities=[];closePop();render()}
function showAddAuditPage(){closePop();let o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="add-page-title"><h2 id="add-page-title">Add page</h2><label class="field">Page name<input id="audit-page-name" placeholder="About"></label><label class="field">Path<input id="audit-page-path" placeholder="/about"></label><div class="dialog-actions"><button class="btn" onclick="closeDialog()">Cancel</button><button class="primary" onclick="addAuditPage()">Add page</button></div></div>`;document.body.appendChild(o);o.addEventListener('mousedown',e=>{if(e.target===o)closeDialog()});document.addEventListener('keydown',escDialog);$('#audit-page-name')?.focus()}
function addAuditPage(){let name=$('#audit-page-name')?.value.trim(),path=$('#audit-page-path')?.value.trim();if(!name||!/^\/[a-z0-9\-\/]*$/i.test(path||''))return toast('Enter a page name and valid path');let id='page-'+Date.now();state.auditPages.push([id,name,path||'/']);state.auditPage=id;closeDialog();render();toast(`${name} added`)}
function severityIcon(type){let n=type==='critical'?'octagonX':type==='security'?'shieldAlert':type==='warning'?'triangleAlert':type==='pass'?'circleCheck':'info',tone=type==='security'?'critical':type;return `<span class="severity-icon sev-${tone}">${ico(n)}</span>`}
function auditSummary(items=AUDIT_CHECKS,types=['critical','security','warning','advisory','pass']){let count=t=>items.filter(x=>x.type===t).length,names={critical:'Critical',security:'Security critical',warning:'Warnings',advisory:'Advisories',pass:'Passed'};return `<div class="audit-summary" aria-label="Filter findings by severity">${types.map(t=>{let active=state.auditSeverities.includes(t);return `<button class="audit-summary-item ${active?'active':''}" title="Filter by ${names[t]}" aria-pressed="${active}" onclick="setAuditSeverity('${t}')">${severityIcon(t)}<b>${count(t)}</b></button>`}).join('')}</div>`}
function setAuditSeverity(type){state.auditSeverities=state.auditSeverities.includes(type)?state.auditSeverities.filter(x=>x!==type):[...state.auditSeverities,type];render()}
function auditMatches(x){let f=String(state.auditFilter||'').toLowerCase(),severityOk=!state.auditSeverities.length||state.auditSeverities.includes(x.type),cat=x.category.toLowerCase(),menuOk=!f||f==='all'||cat===f||cat.includes(f)||x.type===f||(f==='security critical'&&x.type==='security')||f==='open'||f==='not reviewed';return severityOk&&menuOk}
function auditFilterRow(context='overview'){return `<div class="audit-filter-row"><button class="btn" onclick="auditFilterMenu(event,'${context}')">${ico('filter')} Filters</button>${state.auditFilter?`<span class="filter-chip">${esc(state.auditFilter)} <button aria-label="Clear filter" style="border:0;background:none" onclick="state.auditFilter=null;render()">×</button></span>`:''}<span class="spacer"></span></div>`}
function auditGuide(category){if(category.includes('Accessibility'))return 'https://www.w3.org/WAI/WCAG22/quickref/';if(category.includes('Performance')||category.includes('Mobile'))return 'https://web.dev/learn/performance/';if(category.includes('Security'))return 'https://developer.mozilla.org/en-US/docs/Web/Security';if(category.includes('DNS'))return 'https://www.icann.org/resources/pages/dns-2023-11-02-en';if(category.includes('Structured'))return 'https://developers.google.com/search/docs/appearance/structured-data/intro-structured-data';return 'https://developers.google.com/search/docs/fundamentals/seo-starter-guide'}
function openAuditItem(e){let item=e.currentTarget.parentElement;if(!item.open)document.querySelectorAll('details.audit-item[open]').forEach(x=>{if(x!==item)x.open=false})}
function auditList(items){let filtered=items.filter(auditMatches);return filtered.map(x=>`<details class="audit-item"><summary onclick="openAuditItem(event)">${severityIcon(x.type)}<span><b>${x.title}</b><br><small class="subtle">${x.category} · ${x.meta}</small></span></summary><div class="audit-detail"><div class="finding-status"><span class="tag">Open</span><span class="subtle">Review status: not reviewed</span></div><p>${x.summary}</p><b>Affected element or resource</b><code>${esc(x.evidence)}</code><b>Recommended fix</b><p>${x.fix}</p><div class="settings-actions"><button class="btn" onclick="toast('Re-test queued for this finding')">${ico('rotateCw')} Re-test</button><a class="btn learn-more" href="${x.url||auditGuide(x.category)}" target="_blank" rel="noopener noreferrer">${ico('info')} Learn more</a></div></div></details>`).join('')||'<div class="empty-state"><b>No findings match these filters</b><small>Try another severity, category or review status.</small><button class="btn" onclick="state.auditFilter=null;state.auditSeverities=[];render()">Clear all filters</button></div>'}
function performanceTable(d,device){let actual=state.perfMode==='Real-user data',mobile=device==='Mobile',values=actual?(mobile?[['LCP','2.8 s','≤ 2.5 s','orange'],['INP','186 ms','≤ 200 ms','green'],['CLS','0.05','≤ 0.1','green'],['FCP','1.7 s','≤ 1.8 s','green']]:[['LCP','2.3 s','≤ 2.5 s','green'],['INP','168 ms','≤ 200 ms','green'],['CLS','0.04','≤ 0.1','green'],['FCP','1.5 s','≤ 1.8 s','green']]):(mobile?[['LCP',d.lcp,'≤ 2.5 s','orange'],['TBT','196 ms','≤ 200 ms','green'],['CLS',state.auditPage==='contact'?'0.06':'0.03','≤ 0.1','green'],['FCP',d.fcp,'≤ 1.8 s','orange']]:[['LCP','2.1 s','≤ 2.5 s','green'],['TBT','142 ms','≤ 200 ms','green'],['CLS','0.02','≤ 0.1','green'],['FCP','1.4 s','≤ 1.8 s','green']]),help={LCP:['Largest Contentful Paint','Measures how quickly the largest visible content element finishes rendering.'],INP:['Interaction to Next Paint','Real-user responsiveness based on recorded interactions.'],TBT:['Total Blocking Time','Lab responsiveness while the page loads.'],CLS:['Cumulative Layout Shift','Measures unexpected movement of visible page content while it loads.'],FCP:['First Contentful Paint','Measures when the first text, image or other content appears.']};return `<div class="table-wrap"><table class="performance-table"><thead><tr><th>Metric</th><th>Value</th><th>Target</th></tr></thead><tbody>${values.map(x=>`<tr title="${help[x[0]][0]} — ${help[x[0]][1]}"><td><b>${x[0]}</b></td><td><b>${x[1]}</b></td><td><span class="target-state">${x[2]} <i class="status-mini ${x[3]}"></i></span></td></tr>`).join('')}</tbody></table></div>`}
function performancePanel(d,device){return `<div class="panel"><div class="panel-head"><h2 class="performance-title" title="${device} results">${ico(device==='Mobile'?'smartphone':'monitor')} ${device} performance</h2></div>${performanceTable(d,device)}</div>`}
function performanceToggle(){return `<div class="toolbar performance-mode"><span class="seg"><button class="${state.perfMode==='Lab audit'?'active':''}" onclick="state.perfMode='Lab audit';render()">Lab audit</button><button class="${state.perfMode==='Real-user data'?'active':''}" onclick="state.perfMode='Real-user data';render()">Real-user data</button></span><small class="subtle">Lab uses load-based TBT; real-user data uses INP.</small></div>`}
function catalogueChecks(){let out=[],index=0,d=auditDataset(),path=auditPagePath(),rate={homepage:.85,services:.9,contact:.81}[state.auditPage]??.85,total=Object.values(AUDIT_CATALOG).reduce((n,a)=>n+a.length,0),failTotal=total-Math.round(total*rate);for(let [category,names] of Object.entries(AUDIT_CATALOG)){for(let title of names){let fail=Math.floor((index+1)*failTotal/total)>Math.floor(index*failTotal/total),type=fail?(category.includes('Security')?'security':index%3===0?'critical':index%3===1?'warning':'advisory'):'pass';out.push({category,type,title,meta:`Latest audit · ${d.label}`,summary:type==='pass'?'This check completed successfully during the latest audit.':'The latest audit detected a condition that needs review.',evidence:type==='pass'?`${title}: passed on https://websi.com${path}.`:`${title}: review required on https://websi.com${path}.`,fix:type==='pass'?'No action required.':`Review the affected page or configuration and update it so “${title.toLowerCase()}” passes on the next audit.`,url:auditGuide(category)});index++}}return out}
function auditHome(){let d=auditDataset(),allowed=['critical','security','warning'];state.auditSeverities=state.auditSeverities.filter(x=>allowed.includes(x));let pageSets={homepage:[0,1,2,3,4,5,6],services:[0,2,3,4,5],contact:[1,2,3,5,6]},indexes=pageSets[state.auditPage]||pageSets.homepage,priority=AUDIT_CHECKS.filter((x,i)=>allowed.includes(x.type)&&indexes.includes(i));return `<div class="grid"><div class="panel"><h2>Fix these first · ${d.label}</h2>${auditSummary(priority,allowed)}${auditFilterRow('overview')}${auditList(priority)}</div><div>${performanceToggle()}${performancePanel(d,'Desktop')}${performancePanel(d,'Mobile')}</div></div>`}
function findings(){let d=auditDataset(),items=catalogueChecks(),cats=Object.keys(AUDIT_CATALOG),visible=items.filter(auditMatches);return `<div class="panel"><div class="panel-head"><h2>${d.label} findings</h2></div>${auditSummary(items)}${auditFilterRow('findings')}<div>${cats.map(c=>{let group=visible.filter(x=>x.category===c);return group.length?`<details class="audit-category" ${(state.auditFilter||state.auditSeverities.length)?'open':''}><summary>${c} <span class="subtle">${group.length} checks</span></summary><div class="audit-category-body">${auditList(group)}</div></details>`:''}).join('')||'<p class="subtle">No findings match this filter.</p>'}</div></div>`}
function checks(){let items=catalogueChecks(),rows=Object.keys(AUDIT_CATALOG).map(c=>{let group=items.filter(x=>x.category===c),passed=group.filter(x=>x.type==='pass').length,findings=group.length-passed,informational=/Server|Optional Resources/.test(c)?Math.max(1,Math.round(group.length*.18)):0;return [c,group.length,passed,findings,informational,Math.round(passed/group.length*100)]}),passed=items.filter(x=>x.type==='pass').length;return metrics([['Automated checks',items.length],['Passed',passed],['Findings',items.length-passed],['Informational / N/A','18'],['Reviewed','0']])+`<div class="panel"><h2>${auditDataset().label} checks</h2><div class="table-wrap"><table class="checks-table"><thead><tr><th>Category</th><th>Checks</th><th>Passed</th><th>Findings</th><th>Info / N/A</th><th>Pass rate</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="checks-category"><span class="checks-bar" style="width:${r[5]}%"></span><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}%</td></tr>`).join('')}</tbody></table></div><p class="subtle">Server information and optional AI resources can be informational or not applicable rather than forced pass/fail results. Automated accessibility checks support review but do not represent a complete compliance assessment.</p></div>`}
function historyView(){let d=auditDataset();return `<div class="panel"><h2>${d.label} audit history</h2>${simpleTable(['Scan','Overall','SEO','Performance','Accessibility','Security','Infrastructure','AI readiness'],[['29 Sep 2026',d.overall,d.seo,d.performance,d.accessibility,d.security,d.infrastructure,d.ai],['15 Sep 2026',d.overall-5,d.seo-4,d.performance-7,d.accessibility-5,d.security-3,d.infrastructure-4,d.ai-6],['1 Sep 2026',d.overall-9,d.seo-7,d.performance-12,d.accessibility-8,d.security-6,d.infrastructure-7,d.ai-9]])}<p class="subtle">AI readiness reflects technical accessibility for AI crawlers and structured extraction—not likelihood of appearing in AI answers.</p></div>`}function compare(){let d=auditDataset(),previous=d.overall-9,resolved=8,newCount=2,unchanged=36,current=unchanged+newCount;return `<div class="panel"><div class="toolbar compare-selectors"><label>Earlier scan<select><option>1 Sep 2026 · 09:00</option><option>15 Sep 2026 · 09:00</option></select></label><span>compared with</span><label>Latest scan<select><option>29 Sep 2026 · 14:20</option></select></label></div></div>`+metrics([['Overall',`${previous} → ${d.overall}`,'+9'],['Performance',`${Math.max(0,d.performance-12)} → ${d.performance}`,'+12'],['Resolved',resolved],['New',newCount]])+`<div class="panel"><h2>${d.label} finding comparison</h2>${simpleTable(['Status','Count'],[['Resolved',resolved],['New',newCount],['Unchanged',unchanged],['Current findings',current]])}<p class="subtle">Previous findings: ${resolved+unchanged}. Current findings: ${current}. Resolved items are not included in the current total.</p></div>`}

function showAccountDanger(action){let label=action==='delete'?'Delete account':'Reset account',o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="dialog" role="alertdialog" aria-modal="true"><h2>${label}</h2><p class="danger-copy">This action affects all locally stored data for Adam Jordan and cannot be undone in this session.</p><p>Type <b>ADAM JORDAN</b> in capitals to confirm.</p><label class="field">Account name<input id="account-danger-confirm" autocomplete="off" placeholder="ADAM JORDAN"></label><div class="dialog-actions"><button class="btn" onclick="closeDialog()">Cancel</button><button class="danger-solid" onclick="confirmAccountDanger('${action}')">${action==='delete'?'DELETE':'RESET'}</button></div></div>`;document.body.appendChild(o);document.addEventListener('keydown',escDialog);$('#account-danger-confirm')?.focus()}

function simpleTable(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function barTable(head,rows,max){return `<div class="table-wrap"><table class="bar-table"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.slice(0,-1).map((x,i)=>`<td class="${i===0?'bar-cell':''}">${i===0?`<span class="bar-bg" style="width:${Math.max(4,r[r.length-1]/max*92)}%"></span><span>${x}</span>`:x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function sectionFilters(section,items,scope){return `<div class="toolbar section-filters"><button class="btn" onclick="sectionFilterMenu(event,'${esc(section)}','${esc(items.join('|'))}')">${ico('filter')} Add filter</button>${state.filters.map((x,i)=>`<span class="filter-chip">${esc(x)} <button aria-label="Remove ${esc(x)} filter" onclick="state.filters.splice(${i},1);render()">×</button></span>`).join('')}${state.filters.length?`<button class="text-link" onclick="state.filters=[];render()">Clear all</button>`:''}<small class="subtle">Filters affect ${esc(scope)}.</small></div>`}
function sectionFilterMenu(e,section,itemString){e.stopPropagation();closePop();let items=itemString.split('|'),m=document.createElement('div');m.className='menu section-filter-menu';m.id='popover';m.innerHTML=`<b style="display:block;padding:8px">Filter ${section}</b><input aria-label="Search filter values" placeholder="Search values…" oninput="filterMenuValues(this.value)"><div id="sectionFilterValues">${items.map(x=>`<button data-filter-value="${esc(x.toLowerCase())}" onclick="state.filters.push('${esc(x)}: All');closePop();render()">${x}<span class="spacer"></span>${ico('chevronRight')}</button>`).join('')}</div>${state.filters.length?'<div class="menu-divider"></div><button onclick="state.filters=[];closePop();render()">Clear all filters</button>':''}`;document.body.appendChild(m);let r=e.currentTarget.getBoundingClientRect();m.style.left=Math.max(8,Math.min(innerWidth-290,r.left))+'px';m.style.top=Math.min(innerHeight-m.offsetHeight-8,r.bottom+5)+'px';setTimeout(()=>addEventListener('click',outside,{once:true}))}
function filterMenuValues(q){document.querySelectorAll('[data-filter-value]').forEach(x=>x.hidden=!x.dataset.filterValue.includes(q.toLowerCase()))}
function detailDialog(title,body,actions=''){closePop();let o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="dialog detail-dialog" role="dialog" aria-modal="true"><div class="panel-head"><h2>${title}</h2><span class="spacer"></span><button class="iconbtn" aria-label="Close" onclick="closeDialog()">×</button></div>${body}<div class="dialog-actions">${actions}<button class="btn" onclick="closeDialog()">Close</button></div></div>`;document.body.appendChild(o);o.addEventListener('mousedown',e=>{if(e.target===o)closeDialog()});document.addEventListener('keydown',escDialog)}

function filterMenu(e,graph=false){e?.stopPropagation();closePop();let m=document.createElement('div');m.className='menu';m.id='popover';m._graph=graph;m._sets=graph?{Device:[['Mobile',p=>true],['Desktop',p=>true],['Tablet',p=>true]],Page:[['Homepage',p=>true],['Services',p=>true],['Contact',p=>true]],Source:[['Google',p=>true],['Direct',p=>true],['LinkedIn',p=>true]],Browser:[['Chrome',p=>true],['Safari',p=>true],['Firefox',p=>true]],Event:[['Successful form submissions',p=>true],['Downloads',p=>true]],Country:[['United Kingdom',p=>true],['United States',p=>true],['Germany',p=>true]],'UTM campaign':[['September newsletter',p=>true],['Partner launch',p=>true]]}:{Property:[['websi.com',p=>p[0]==='websi'],['North Commerce',p=>p[0]==='north'],['Willow Legal',p=>p[0]==='willow']],'Monitor status':[['Online',p=>p[3]==='online'],['Offline',p=>p[3]==='down'],['Paused',p=>p[3]==='paused']],'Tracking status':[['Receiving data',p=>p[3]!=='paused'],['Not installed',p=>p[3]==='paused'],['Inactive',p=>p[3]==='paused']],'Audit score':[['Below 80',p=>p[6]&&p[6]<80],['80–89',p=>p[6]>=80&&p[6]<90],['90+',p=>p[6]>=90]],'Performance range':[['Below 70',p=>p[8]&&p[8]<70],['70–89',p=>p[8]>=70&&p[8]<90],['90+',p=>p[8]>=90]],'Audit age':[['Within 7 days',p=>true],['8–30 days',p=>true],['Not yet audited',p=>!p[6]]]};let first=graph?'Device':'Tracking status';m.innerHTML=`<b style="display:block;padding:9px 12px 3px">Filter by</b><input aria-label="Search filters" placeholder="Search filters…" oninput="filterMenuValues(this.value)"><div class="two-col-menu"><div class="menu-col" id="filterCats">${Object.keys(m._sets).map(x=>`<button data-filter-value="${x.toLowerCase()}" class="${x===first?'selected':''}" onclick="renderFilterChoices('${x}')">${x}<span class="spacer"></span>${ico('chevronRight')}</button>`).join('')}</div><div class="menu-col" id="filterChoices"></div></div>`;document.body.appendChild(m);renderFilterChoices(first);let r=e.currentTarget.getBoundingClientRect();m.style.left=Math.max(8,Math.min(innerWidth-350,r.left))+'px';m.style.top=Math.min(innerHeight-m.offsetHeight-8,r.bottom+5)+'px';setTimeout(()=>addEventListener('click',outside,{once:true}))}
function renderFilterChoices(category){let m=$('#popover');if(!m)return;m._category=category;m._options=m._sets[category];document.querySelectorAll('#filterCats button').forEach(b=>b.classList.toggle('selected',b.textContent.trim().startsWith(category)));$('#filterChoices').innerHTML=`<b style="display:block;padding:7px 8px">${category}</b>${m._options.map((x,i)=>`<button onclick="applyFilter(${i},${m._graph})"><span class="status-dot ${i===0?'online':'paused'}"></span>${x[0]}${i===0?' <span class="spacer"></span>✓':''}</button>`).join('')}`}
function applyFilter(i,graph){let m=$('#popover'),x=m._options[i],label=`${m._category}: ${x[0]}`;if(graph){closePop();toast(label+' filter applied to chart');return}state.propFilter={label,test:x[1]};state.propPage=1;closePop();render()}
function auditFilterMenu(e,context){e.stopPropagation();closePop();let m=document.createElement('div');m.className='menu audit-filter-menu';m.id='popover';let opts=['All','SEO','Performance','Accessibility','Security','Infrastructure','AI Readiness','Critical','Security critical','Warning','Advisory','Pass','Open','Not reviewed',...Object.keys(AUDIT_CATALOG)];m.innerHTML=`<b style="display:block;padding:8px">Filter findings</b><input aria-label="Search audit filters" placeholder="Search category, result or status…" oninput="filterMenuValues(this.value)">${opts.map(x=>`<button data-filter-value="${x.toLowerCase()}" onclick="state.auditFilter='${x==='All'?'':x}';closePop();render()">${x}${(!state.auditFilter&&x==='All')||state.auditFilter===x?'<span class="spacer"></span>✓':''}</button>`).join('')}`;document.body.appendChild(m);let r=e.currentTarget.getBoundingClientRect();m.style.left=Math.min(innerWidth-300,r.left)+'px';m.style.top=Math.min(innerHeight-m.offsetHeight-8,r.bottom+5)+'px';setTimeout(()=>addEventListener('click',outside,{once:true}))}
function switchChart(btn,kind){let seg=btn.parentElement;seg.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn));let svg=seg.closest('.panel').querySelector('.chart');svg.dataset.series=kind;drawChart(svg)}
function copyText(s){navigator.clipboard?.writeText(s).then(()=>toast('Copied')).catch(()=>{let ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();toast('Text selected — press Ctrl+C')})}function blob(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadCSV(){blob('claritude-websi-september.csv','Metric,Value\r\nPageviews,"28,460"\r\nKey events,358\r\nUptime,99.92%\r\nAudit score,87','text/csv;charset=utf-8')}function downloadData(){blob('claritude-demo-data.json',JSON.stringify({seed:SEED,state},null,2),'application/json')}function downloadHTML(n){blob('claritude-report.html',`<!doctype html><meta charset="utf-8"><title>${n}</title><h1>${n}</h1><p>Websi · September 2026</p><table><tr><th>Pageviews</th><td>28,460</td></tr><tr><th>Key events</th><td>358</td></tr><tr><th>Uptime</th><td>99.92%</td></tr></table><p>Fictional Claritude demo report.</p>`,'text/html')}function resetDemo(){store.clear();state.projects=SEED.projects.map(x=>[...x]);state.reports=SEED.reports.map(x=>[...x]);state.events=SEED.events.map(x=>[...x]);state.formDirty=false;toast('Demo data restored');setTimeout(()=>go('/all/properties'),400)}function help(){detailDialog('Help & setup',`<label class="field">Search help<input placeholder="Search help" oninput="toast('Showing help results')"></label><div class="help-links"><button onclick="go('/websi/overview/setup');closeDialog()"><b>Onboarding setup</b><small>Add a property, monitoring, analytics and the first audit.</small></button><button onclick="go('/websi/settings/tracking');closeDialog()"><b>Tracking configuration</b><small>Installation, testing and troubleshooting.</small></button><button onclick="go('/websi/uptime/monitor%20settings');closeDialog()"><b>Uptime settings</b><small>Intervals, thresholds and let lastRouteHash=location.hash;addEventListener('hashchange',()=>{if(state.formDirty&&!confirm('You have unsaved changes. Leave without saving?')){history.replaceState(null,'',lastRouteHash||'#/all/properties');render();return}state.formDirty=false;lastRouteHash=location.hash;route()});addEventListener('beforeunload',e=>{if(state.formDirty){e.preventDefault();e.returnValue=''}});route();
