name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a migration or deployment already in progress. GitHub keeps
# only the newest pending run in this group, so stale queued commits are safely
# superseded without cancelling an in-flight production change.
concurrency:
  group: claritude-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated audit registry
        run: |
          npm run audit:registry
          git diff --exit-code

      - name: TypeScript checks
        run: npm run check

      - name: Automated tests
        run: npm test -- --passWithNoTests

      - name: Production build
        run: npm run build

      - name: Preserve validated deployment build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claritude-production-${{ github.sha }}
          path: |
            dist
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Migrate, deploy and verify
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.claritude.io
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Confirm this is the current main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq '.object.sha')"
          if [ "$latest_sha" = "$EXPECTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit superseded this run before migration."
          fi

      - name: Use Node.js 22
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked deployment tools
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci

      - name: Restore validated deployment build
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: claritude-production-${{ github.sha }}
          path: .

      - name: Apply production migrations safely
        if: steps.gate.outputs.deploy == 'true'
        id: migrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing production secret SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_DB_PASSWORD:?Missing production secret SUPABASE_DB_PASSWORD}"
          : "${SUPABASE_PROJECT_ID:?Missing production variable SUPABASE_PROJECT_ID}"
          npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
          npx --no-install supabase migration list --linked --output-format json > migration-before.json
          node scripts/validate-migration-state.mjs migration-before.json --allow-pending
          npx --no-install supabase db push --linked --dry-run
          npx --no-install supabase db push --linked --yes
          npx --no-install supabase migration list --linked --output-format json > migration-after.json
          node scripts/validate-migration-state.mjs migration-after.json --require-synced
          npx --no-install supabase db lint --linked --level warning --fail-on warning

      - name: Stamp deployment commit
        if: steps.gate.outputs.deploy == 'true'
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/stamp-deployment-config.mjs

      - name: Deploy Cloudflare Worker and assets
        if: steps.gate.outputs.deploy == 'true'
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Missing production secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing production variable CLOUDFLARE_ACCOUNT_ID}"
          output_file="$(mktemp)"
          npx --no-install wrangler deploy 2>&1 | tee "$output_file"
          version_id="$(sed -n 's/.*Current Version ID: //p' "$output_file" | tail -n 1 | tr -d '\r')"
          if ! [[ "$version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "Wrangler did not report a valid Worker version ID."
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Verify production health and deployed commit
        if: steps.gate.outputs.deploy == 'true'
        id: health
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/verify-production-health.mjs https://app.claritude.io/health "$EXPECTED_COMMIT_SHA"

      - name: Record deployment summary
        if: success() && steps.gate.outputs.deploy == 'true'
        env:
          VERSION_ID: ${{ steps.cloudflare.outputs.version_id }}
          PENDING_MIGRATIONS: ${{ steps.migrate.outputs.pending }}
        run: |
          {
            echo "### Claritude production deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Worker version: \`$VERSION_ID\`"
            echo "- Migrations applied: \`${PENDING_MIGRATIONS:-none}\`"
            echo "- Health: passed"
            echo "- URL: https://app.claritude.io/health"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record superseded deployment
        if: steps.gate.outputs.deploy == 'false'
        run: echo "This deployment was safely superseded by a newer main commit before migration." >> "$GITHUB_STEP_SUMMARY"

      - name: Record rollback safety warning
        if: failure() && steps.gate.outputs.deploy == 'true'
        run: |
          {
            echo "### Production deployment failed"
            echo "No automatic rollback was attempted."
            echo "Inspect the migration and deployment steps before selecting a previous Cloudflare version; a pre-migration Worker may not be schema-compatible."
          } >> "$GITHUB_STEP_SUMMARY"
